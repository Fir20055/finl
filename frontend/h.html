<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعي Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: #f8fafc;
        }

        header {
            background: #4f46e5;
            color: white;
            padding: 20px 0;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        section h2 {
            text-align: center;
            margin: 30px 0 20px;
        }

        footer {
            background: #4f46e5;
            color: white;
            text-align: center;
            padding: 15px 0;
            margin-top: 20px;
        }

        .card h3 {
            color: #4f46e5;
        }
    </style>
</head>

<body>
    <header>
        <h1>فردوس </h1>
    </header>

    <nav class="navbar navbar-expand-lg navbar-dark" style="background:#6366f1;">
        <div class="container">
            <a class="navbar-brand" href="#">الرئيسية</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#">عن الموقع</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">خدماتنا</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">تواصل معنا</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="container">
        <h2>خدماتنا</h2>
        <div class="row justify-content-center g-4">
            <div class="col-md-4">
                <div class="card text-center p-3 shadow-sm">
                    <h3>تصميم</h3>
                    <p>تصميم واجهات جذابة وسهلة الاستخدام.</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center p-3 shadow-sm">
                    <h3>تطوير</h3>
                    <p>مواقع وتطبيقات متجاوبة وسريعة.</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center p-3 shadow-sm">
                    <h3>دعم</h3>
                    <p>خدمة عملاء سريعة على مدار الساعة.</p>
                </div>
            </div>
        </div>
    </section>

    <footer>
        &copy; 2025 موقعي Bootstrap
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
